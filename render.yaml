services:
  - type: web
    name: cybershield-dis
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CYBERSHIELD_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
